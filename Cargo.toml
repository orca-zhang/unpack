[package]
name = "unpack"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
description = "Executable packer detection and unpacking, with a compatible Go SDK"
license = "MIT"
repository = "https://github.com/orca-zhang/unpack"

[lib]
path = "rust/lib.rs"

[[bin]]
name = "unpack-rs"
path = "rust/main.rs"

[dependencies]
base64 = "0.22"
memchr = "2"
crc32fast = "1"
flate2 = "1"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz", "optimization"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = true

