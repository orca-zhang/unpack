      <path d="M762 192V206L882 276V262Z" fill="#4f8a6c"/>
      <path d="M1002 192V206L882 276V262Z" fill="#91d9ab"/>
      <path d="M762 124 882 54 1002 124 882 194Z" fill="url(#lid)" stroke="#d4f8de"/>
      <path d="M762 124V138L882 208V194Z" fill="#6fb98c"/>
      <path d="M1002 124V138L882 208V194Z" fill="#a2e6b9"/>
      <path d="m847 123 28 16 49-28" fill="none" stroke="#326a50" stroke-width="7" stroke-linecap="round"/>
