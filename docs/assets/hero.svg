      <text x="1043" y="254" fill="#94bda1">UPX</text>
      <text x="1043" y="310" fill="#7aa38b">PE / ELF</text>
    </g>
    <circle cx="1084" cy="375" r="4" fill="#a9e7bc"/>
    <text x="1069" y="404" fill="#719589" font-size="10" letter-spacing="1">LAYER 00</text>
  </g>
</svg>
