<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc" lang="zh-CN">
  <title id="title">Unpack — 看清每一层</title>
  <desc id="desc">Unpack 2.0 可执行文件壳分析工具，采用 Rust 核心与兼容 Go SDK。22 种内置格式，5 个原生解码器。分层图展示 GZIP、XZ、UPX 与解包结果。</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a7dec1" stroke-opacity=".06" />
    </pattern>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#193d36" /><stop offset="1" stop-color="#0c2227" />
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d5ffe0" /><stop offset="1" stop-color="#83d6ab" />
    </linearGradient>
  </defs>
  <rect width="1200" height="440" rx="20" fill="#0d2428" />
  <rect x="650" width="550" height="440" rx="20" fill="url(#surface)" />
  <rect width="1200" height="440" rx="20" fill="url(#grid)" />
  <path d="M650 0V440" stroke="#24473f" />
  <g font-family="Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif">
    <g transform="translate(52 42)">
