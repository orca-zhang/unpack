      <rect x="185" y="12" width="43" height="25" rx="12" fill="#284c40" />
      <text x="206.5" y="29" text-anchor="middle" fill="#b6edcb" font-size="12">2.0</text>
    </g>
    <text x="52" y="166" fill="#f1f8f2" font-size="66" font-weight="700" letter-spacing="-2.5">看清</text>
    <text x="52" y="238" fill="#b6edcb" font-size="66" font-weight="700" letter-spacing="-2.5">每一层。</text>
    <text x="55" y="282" fill="#a3bfb7" font-size="18">可执行文件壳分析，基于 Rust 构建。</text>
    <path d="M54 319H596" stroke="#33564c" />
