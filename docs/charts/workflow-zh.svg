<svg xmlns="http://www.w3.org/2000/svg" width="900" height="514" viewBox="0 0 900 514" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">Unpack 如何逐层处理文件</title>
<desc id="desc">Rust 库、命令行与静态链接的 Go SDK 共享同一核心。</desc>
<g font-family="Arial, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif">
<rect x="0.5" y="0.5" width="899.000" height="513" rx="16" fill="#f5f9f7" /><rect x="0.5" y="0.5" width="899" height="513" rx="16" fill="none" stroke="#dce6e1" /><rect x="28" y="22" width="4.000" height="22" rx="2" fill="#157d70" /><text x="44" y="39" font-size="22" fill="#152e2b" text-anchor="start">Unpack 如何逐层处理文件</text><text x="28" y="65" font-size="12" fill="#526966" text-anchor="start">Rust 库、命令行与静态链接的 Go SDK 共享同一核心。</text><path d="M28 80H872" stroke="#dce6e1" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#809891" stroke-width="1.5" /></marker></defs>
<rect x="28" y="170" width="150.000" height="118" rx="12" fill="#e5efea" />
<text x="46" y="197" font-size="11" fill="#526966" text-anchor="start">调用入口</text>
<text x="46" y="225" font-size="17" fill="#152e2b" text-anchor="start">Rust 库 / 命令行</text>
<text x="46" y="250" font-size="17" fill="#152e2b" text-anchor="start">Go SDK</text>
<text x="46" y="272" font-size="11" fill="#526966" text-anchor="start">cgo + Rust 静态库</text>
<rect x="220" y="170" width="166.000" height="118" rx="12" fill="#152e2b" />
<text x="238" y="198" font-size="11" fill="#9ccdc0" text-anchor="start">Rust 核心</text>
<text x="238" y="229" font-size="18" fill="#ffffff" text-anchor="start">识别与逐层处理</text>
<text x="238" y="255" font-size="12" fill="#d2e5dc" text-anchor="start">资源限制 / 层级历史</text>
<text x="238" y="275" font-size="12" fill="#d2e5dc" text-anchor="start">校验每层结果</text>
<path d="M178 229H216M386 229H410M410 142V394" fill="none" stroke="#809891" stroke-width="1.5" marker-end="url(#arrow)" />
<rect x="730" y="170" width="142.000" height="118" rx="12" fill="#e5efea" />
<text x="746" y="198" font-size="11" fill="#526966" text-anchor="start">处理结果</text>
<text x="746" y="225" font-size="16" fill="#152e2b" text-anchor="start">数据与层级历史</text>
<text x="746" y="251" font-size="11" fill="#526966" text-anchor="start">识别依据 / 提示</text>
<text x="746" y="272" font-size="11" fill="#526966" text-anchor="start">明确的错误类型</text>
<path d="M702 142V394M702 229H726" fill="none" stroke="#809891" stroke-width="1.5" marker-end="url(#arrow)" />
<path d="M410 142H434M684 142H702" fill="none" stroke="#809891" stroke-width="1.5" marker-end="url(#arrow)" />
<rect x="438" y="110" width="246.000" height="64" rx="10" fill="#e1f1e8" />
<text x="454" y="135" font-size="15" fill="#152e2b" text-anchor="start">01  原生解码</text>
<text x="454" y="156" font-size="11" fill="#526966" text-anchor="start">AP32 / GZIP / ZLIB / XZ / LZMA</text>
<path d="M410 226H434M684 226H702" fill="none" stroke="#809891" stroke-width="1.5" marker-end="url(#arrow)" />
<rect x="438" y="194" width="246.000" height="64" rx="10" fill="#e6edf3" />
<text x="454" y="219" font-size="15" fill="#152e2b" text-anchor="start">02  官方 UPX 后端</text>
<text x="454" y="240" font-size="11" fill="#526966" text-anchor="start">PE / ELF / Mach-O 样本</text>
<path d="M410 310H434M684 310H702" fill="none" stroke="#809891" stroke-width="1.5" marker-end="url(#arrow)" />
<rect x="438" y="278" width="246.000" height="64" rx="10" fill="#fcf0df" />
<text x="454" y="303" font-size="15" fill="#152e2b" text-anchor="start">03  静态 PE 恢复</text>
<text x="454" y="324" font-size="11" fill="#526966" text-anchor="start">10 种壳 / 需显式启用</text>
<path d="M410 394H434M684 394H702" fill="none" stroke="#809891" stroke-width="1.5" marker-end="url(#arrow)" />
<rect x="438" y="362" width="246.000" height="64" rx="10" fill="#ecf0f2" />
<text x="454" y="387" font-size="15" fill="#152e2b" text-anchor="start">04  仅识别</text>
<text x="454" y="408" font-size="11" fill="#526966" text-anchor="start">6 种壳 / 解包返回不支持</text>
<text x="28" y="468" font-size="12" fill="#526966" text-anchor="start">自动模式逐层解码；静态恢复后停止处理。全程不执行待分析的程序。</text>
<text x="28" y="490" font-size="12" fill="#526966" text-anchor="start">LZMA-Alone 需显式指定；UPX 需安装官方程序；静态恢复不保证程序可运行。</text></g></svg>
