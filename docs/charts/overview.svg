<text x="28" y="395" font-size="12" fill="#526966" text-anchor="start">Apple M4 Pro / release Rust + Go benchmarks / median of five batches / lower is better.</text>
<text x="28" y="416" font-size="12" fill="#526966" text-anchor="start">Logarithmic bar lengths; labels show measured values. Excludes I/O, startup and end-to-end unpacking.</text>
<text x="28" y="437" font-size="12" fill="#526966" text-anchor="start">SDK values measure response-decode allocations only; the existing payload buffer is excluded.</text></g></svg>
