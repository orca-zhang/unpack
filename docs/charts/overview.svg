<rect x="314" y="100" width="272.000" height="265" rx="12" fill="#ffffff"/>
<text x="332" y="127" font-size="11" fill="#526966" text-anchor="start">02 / NATIVE DECODE</text>
<text x="332" y="157" font-size="16" fill="#152e2b" text-anchor="start">AP32 / 65 KiB</text>
