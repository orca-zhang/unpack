<text x="618" y="127" font-size="11" fill="#526966" text-anchor="start">03 / SDK ALLOCATION</text>
<text x="618" y="157" font-size="16" fill="#152e2b" text-anchor="start">4 MiB response decode</text>
<text x="618" y="204" font-size="34" fill="#157d70" text-anchor="start">99.992%</text>
<text x="618" y="226" font-size="12" fill="#526966" text-anchor="start">less allocated</text>
