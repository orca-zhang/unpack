<svg xmlns="http://www.w3.org/2000/svg" width="900" height="394" viewBox="0 0 900 394" role="img" aria-labelledby="title desc">
<title id="title">Format support: 22 built-in formats</title>
<desc id="desc">Capability categories, not a claim of full commercial protector removal.</desc>
<g font-family="Arial, Helvetica, sans-serif">
